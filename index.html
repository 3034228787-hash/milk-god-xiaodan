  <style>
    :root{color-scheme:dark;--gold:#eacb8f;--ivory:#fff0d2;--purple:#ae86ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#110b20}
    body{color:var(--ivory);font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow-x:hidden}
    .temple{position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:90px 24px 66px;background:radial-gradient(ellipse at 50% 43%,#58325833 0,#2e1b4933 34%,transparent 67%),linear-gradient(180deg,#130d22,#191029 57%,#100c18)}
    .temple:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.4' d='M0 0h180v180H0z'/%3E%3C/svg%3E");pointer-events:none}
    .frame{position:absolute;inset:23px;border:1px solid #d7b87c30;pointer-events:none;z-index:5}
    .frame:before,.frame:after{content:"✦";position:absolute;left:50%;transform:translateX(-50%);font-size:19px;color:#b99b68;background:#140e20;padding:0 17px;line-height:20px}
    .frame:before{top:-11px}.frame:after{bottom:-11px}
    .corner{position:absolute;width:38px;height:38px;border-color:#c4a16d9c;border-style:solid}
    .corner:nth-child(1){left:-1px;top:-1px;border-width:2px 0 0 2px}.corner:nth-child(2){right:-1px;top:-1px;border-width:2px 2px 0 0}.corner:nth-child(3){left:-1px;bottom:-1px;border-width:0 0 2px 2px}.corner:nth-child(4){right:-1px;bottom:-1px;border-width:0 2px 2px 0}
    .masthead{position:absolute;top:52px;left:0;width:100%;display:flex;align-items:center;justify-content:center;gap:17px;font-size:10px;letter-spacing:5px;color:#c5ad85;z-index:3}
    .masthead:before,.masthead:after{content:"";height:1px;width:55px;background:linear-gradient(90deg,transparent,#c5ad8570)}.masthead:after{transform:rotate(180deg)}
    .rays{position:absolute;width:min(1300px,160vw);aspect-ratio:1;left:50%;top:44%;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,#e2b37c00 0deg 10deg,#ebc88f0a 11deg 12deg,#e2b37c00 14deg 20deg);mask-image:radial-gradient(circle,transparent 8%,#000 25%,transparent 69%);animation:turn 100s linear infinite;z-index:-1}
    .aura{position:absolute;top:42%;left:50%;width:700px;height:700px;transform:translate(-50%,-50%);background:radial-gradient(circle,#d5a5ff12 0,#a676fb10 35%,transparent 67%);pointer-events:none}
    .lightning{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
    .bolt{fill:none;stroke-linejoin:bevel;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:thunder 5s ease-in-out infinite}
    .bolt.violet{stroke:#c1a5ff;stroke-width:1.9;filter:drop-shadow(0 0 5px #ac78ff) drop-shadow(0 0 14px #8255ff);opacity:.65}
    .bolt.gold{stroke:#ffe8ad;stroke-width:1.3;filter:drop-shadow(0 0 5px #f6c66a) drop-shadow(0 0 16px #d49d58);opacity:.7;animation-delay:-2.2s}
    .branch{opacity:.42;stroke-width:.8!important}
    #particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
    .content{position:relative;text-align:center;z-index:3;display:flex;flex-direction:column;align-items:center;width:100%}
    .invocation{margin:0 0 39px;font-size:12px;letter-spacing:10px;font-weight:400;color:#d8bc89;padding-left:10px;display:flex;align-items:center;gap:22px}
    .invocation span{font-family:Georgia,serif;font-size:19px;letter-spacing:0;color:#e5c587}
    .relic{position:relative;width:262px;height:262px;display:grid;place-items:center}
    .orbit{position:absolute;inset:-30px;border:1px solid #d3ad6552;border-radius:50%;animation:turn 65s linear infinite}
    .orbit:before,.orbit:after{content:"✧";position:absolute;left:50%;transform:translateX(-50%);background:#281b35;font-size:22px;line-height:24px;color:#d5b47a}.orbit:before{top:-13px}.orbit:after{bottom:-13px}
    .orbit.inner{inset:-15px;border-style:dashed;border-color:#d6b7803b;animation-direction:reverse;animation-duration:100s}.orbit.inner:before,.orbit.inner:after{display:none}
    .portrait{position:relative;width:100%;height:100%;border-radius:50%;padding:7px;border:1px solid #e4c48b;background:linear-gradient(135deg,#dfbd7240,#fbe6a608 50%,#e6c17e50);box-shadow:0 0 35px #e6c07a22,0 0 100px #a987d122,inset 0 0 15px #eec87326}
    .portrait img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:1px solid #d9bd8d7a}
    .crown{position:absolute;top:-60px;left:50%;transform:translateX(-50%);font-size:38px;filter:drop-shadow(0 0 14px #f6cf7b80);color:#f2d898}
    .seal{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%) rotate(-6deg);width:57px;height:57px;display:grid;place-items:center;background:linear-gradient(135deg,#ead19a,#a57d48);border:3px double #fff0b9;box-shadow:0 4px 22px #0006;border-radius:50%;font-family:"STKaiti","KaiTi",serif;font-size:26px;font-weight:bold;color:#382539}
    h1{position:relative;margin:63px 0 0;font-size:clamp(60px,7.8vw,112px);line-height:1.2;font-family:"STSong","SimSun","Songti SC",serif;font-weight:900;letter-spacing:.14em;padding-left:.14em;background:linear-gradient(180deg,#fff9e6 12%,#efd6a4 50%,#bc8d4f 100%);background-clip:text;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #6f4f3c) drop-shadow(0 0 32px #e4b87325)}
    .blessing{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:24px;color:#ae96bb;font-size:11px;letter-spacing:6px;padding-left:6px}
    .blessing:before,.blessing:after{content:"";width:43px;height:1px;background:linear-gradient(90deg,transparent,#bfa57670)}.blessing:after{transform:rotate(180deg)}
    .milk{position:absolute;font-size:37px;filter:drop-shadow(0 0 16px #e9d7ff75);animation:levitate 5s ease-in-out infinite;user-select:none}
    .milk.left{left:calc(50% - 270px);top:41%;transform:rotate(-16deg)}.milk.right{right:calc(50% - 270px);top:55%;font-size:31px;animation-delay:-2.5s}
    .footer{position:absolute;bottom:48px;left:0;width:100%;text-align:center;font-size:9px;color:#89768f;letter-spacing:4px;z-index:3}.footer span{color:#c6a36b;margin:0 12px}
    @keyframes turn{to{rotate:360deg}}
    @keyframes thunder{0%,100%{opacity:.27}40%{opacity:.65}48%{opacity:.4}54%{opacity:.78}64%{opacity:.4}}
    @keyframes levitate{0%,100%{translate:0 0;rotate:-10deg}50%{translate:0 -17px;rotate:8deg}}
    @keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media(min-height:850px){.temple{padding-top:110px;padding-bottom:100px}.invocation{margin-bottom:49px}.relic{width:286px;height:286px}h1{margin-top:73px}}
    @media(max-width:600px){.temple{padding:115px 20px 100px;min-height:100svh}.frame{inset:14px}.masthead{top:40px;font-size:8px;letter-spacing:3px;gap:12px}.masthead:before,.masthead:after{width:28px}.relic{width:206px;height:206px}.invocation{font-size:10px;letter-spacing:7px;margin-bottom:43px;gap:15px}.crown{top:-52px;font-size:31px}.orbit{inset:-25px}.orbit.inner{inset:-12px}.seal{width:49px;height:49px;font-size:23px;bottom:-21px}h1{font-size:clamp(46px,12.2vw,73px);margin-top:61px;letter-spacing:.1em;padding-left:.1em}.blessing{font-size:9px;letter-spacing:4px;gap:12px;margin-top:22px}.blessing:before,.blessing:after{width:22px}.milk.left{left:7%;top:40%;font-size:25px}.milk.right{right:6%;top:57%;font-size:24px}.footer{bottom:38px;font-size:8px;letter-spacing:2px}.lightning{width:100%;left:0}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}#particles{display:none}}
  </style>

      <h1>你好奶啊</h1>
      <p class="blessing">愿奶光与你同在</p>
    </section>
    <div class="footer">含奶量<span>✦</span>神 级</div>
  </main>
  <script>
    (()=>{
      'use strict';
      const canvas=document.getElementById('particles');
      const ctx=canvas.getContext('2d');
      const reduced=matchMedia('(prefers-reduced-motion: reduce)');
      if(!ctx)return;
      let w=0,h=0,dpr=1,points=[],raf=0,last=0;
      function resize(){
        w=canvas.clientWidth;h=canvas.clientHeight;dpr=Math.min(devicePixelRatio||1,2);
        canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
        points=Array.from({length:Math.min(90,Math.round(w*h/11000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.3,s:Math.random()*.16+.07,a:Math.random()*.55+.12,p:Math.random()*Math.PI*2}));
      }
      function draw(t){
        raf=0;if(document.hidden||reduced.matches)return;
        const dt=last?Math.min((t-last)/16.67,3):1;last=t;ctx.clearRect(0,0,w,h);
        for(const p of points){
          p.y-=p.s*dt;if(p.y<-4)p.y=h+4;
          ctx.beginPath();ctx.fillStyle=`rgba(238,204,144,${p.a*(.6+.4*Math.sin(t*.0008+p.p))})`;
          ctx.arc(p.x+Math.sin(t*.0002+p.p)*8,p.y,p.r,0,Math.PI*2);ctx.fill();
        }
        raf=requestAnimationFrame(draw);
      }
      function resume(){if(!document.hidden&&!reduced.matches&&!raf){last=0;raf=requestAnimationFrame(draw)}}
      addEventListener('resize',resize,{passive:true});
      document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else resume()});
      reduced.addEventListener('change',()=>{if(reduced.matches){cancelAnimationFrame(raf);raf=0;ctx.clearRect(0,0,w,h)}else resume()});
      resize();resume();
    })();
  </script>
